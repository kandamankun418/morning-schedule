name: 翌朝のスケジュールを生成

on:
  schedule:
    # 12:00 UTC = 21:00 JST（GitHub側の混雑で数分〜十数分ずれることがあります）
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "対象の日付 (YYYY-MM-DD)。空なら翌日"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: generate-schedule
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 依存関係をインストール
        run: pip install -r requirements.txt

      - name: スケジュールを生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python src/main.py --date "${{ inputs.date }}"
          else
            python src/main.py
          fi

      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: $(TZ=Asia/Tokyo date +%Y-%m-%d) 翌朝のスケジュールを更新"
            git push
          fi
